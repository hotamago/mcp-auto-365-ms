# Configuration for mcp-auto-365-ms.
# Copy to ~/.config/mcp-auto-365-ms/config.toml and edit.
# Every value can also be set via MCP365_* environment variables, which win.

[sharepoint]
# Your tenant and the site the tools default to.
hostname = "vingroupjsc.sharepoint.com"
site_path = "/sites/VF_AIDV"
# Where send_teams_message(file_path=...) uploads chat attachments.
attachment_folder = "VF-VSF Collaboration/00.ViTa/04. Squad Sharepoint/S5/02. Technical Docs/Shared from Chat"
default_download_dir = "docs/sharepoint"

[teams]
# Extra names that should count as a mention of you, on top of the ones derived
# from your signed-in identity (display name, UPN and surname are automatic).
extra_mention_aliases = []
broadcast_aliases = ["@all", "@everyone", "@team", "@channel"]
# Leave empty to use the region from your Teams token.
middle_tier_region = ""
# Undocumented and version-dependent; override if the calendar tool 404s.
calendar_endpoint = "/api/mt/{region}/beta/me/calendarEvents?StartDate={start}&EndDate={end}"

[mail]
# Outlook Web first-party SPA settings. The defaults use Microsoft's public
# Outlook deployment; no app secret, Graph consent, or token cache is used.
client_id = "9199bf20-a13f-4107-85dc-02114787ef48"
tenant_id = "organizations"
# Leave empty to derive the account from the signed-in Teams identity.
username = ""
login_host = "login.microsoftonline.com"
origin = "https://outlook.office.com"
scope = "https://outlook.office.com/.default openid profile offline_access"
redirect_uri = "https://outlook.office.com/mail/"
api_root = "https://outlook.office.com/api/v2.0"

[browser]
# One of: chrome, chromium, brave, edge
name = "chrome"
# A profile directory name, or "auto" to pick the most recently used one.
profile = "Default"
user_data_dir = ""

[http]
timeout = 30.0
max_retries = 3
max_workers = 6
conversation_cache_ttl = 30.0

[word]
# Word Companion Add-in local bridge settings.
# When enabled, serves the Word taskpane and accepts real-time comments directly
# in open Word documents without downloading/replacing files or causing conflicts.
enabled = true
host = "127.0.0.1"
port = 3650
ssl_enabled = true
cert_file = ""
key_file = ""
