<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Auto 365 Word Companion</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-row">
        <span class="logo">📝</span>
        <h1>Auto 365 Companion</h1>
      </div>
      <div id="connection-badge" class="badge badge-connecting">Đang kết nối bridge...</div>
    </header>

    <main class="main-content">
      <section class="card">
        <h2>Tài liệu đang mở</h2>
        <div class="info-row">
          <span class="label">Tên file:</span>
          <span id="doc-title" class="value text-ellipsis">Đang kiểm tra...</span>
        </div>
        <div class="info-row">
          <span class="label">Đường dẫn:</span>
          <span id="doc-url" class="value text-ellipsis text-muted">Chưa phát hiện</span>
        </div>
        <div class="info-row">
          <span class="label">Phiên kết nối:</span>
          <span id="session-id" class="value text-mono text-muted">-</span>
        </div>
      </section>

      <section class="card">
        <h2>Trạng thái nhận lệnh</h2>
        <p id="bridge-status" class="status-desc">Đang chờ lệnh comment từ coding harness...</p>
        <div class="btn-group">
          <button id="btn-reconnect" class="btn btn-secondary">Làm mới kết nối</button>
          <button id="btn-ping" class="btn btn-secondary">Kiểm tra bridge</button>
        </div>
      </section>

      <section class="card">
        <h2>Nhật ký hoạt động</h2>
        <div id="log-list" class="log-container">
          <div class="log-entry log-entry-info">
            <span class="log-time">--:--:--</span>
            <span class="log-text">Khởi động task pane...</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>MCP Auto 365 MS • Direct Word Review Comments</p>
    </footer>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
