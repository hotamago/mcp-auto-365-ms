[project]
name = "mcp-auto-365-ms"
version = "2.0.0"
description = "Unified MCP server for Microsoft 365: SharePoint, OneDrive, Teams & Outlook mail"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "cryptography>=41.0.0",
    "secretstorage>=3.3.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

# This project is run directly from `src/` via `uv run`, not installed as a
# distribution: the internal imports are flat (`from teams.client import ...`).
[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
